spring.application.name=Smart-Parking-Lot-System
server.port=8080

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/parking_lot_system
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Parking Capacity Constraints
parking.capacity.TWO_WHEELER=15
parking.capacity.LMV=10
parking.capacity.HMV=3